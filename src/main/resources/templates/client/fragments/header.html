<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="client-header">
    <div class="header-container">
        <a href="/" class="logo"><em th:text="${siteName != null ? siteName : 'X-Books'}">X-Books</em></a>
        <nav class="main-nav">
            <a href="/" th:classappend="${requestUri == '/'} ? ' active'" class="nav-link">Shop</a>
            <a href="/collections" th:classappend="${requestUri != null and #strings.startsWith(requestUri, '/collections')} ? ' active'" class="nav-link">Collections</a>
            <a href="/staff-picks" th:classappend="${requestUri != null and #strings.startsWith(requestUri, '/staff-picks')} ? ' active'" class="nav-link">Staff Picks</a>
            <a href="/journals" th:classappend="${requestUri != null and #strings.startsWith(requestUri, '/journals')} ? ' active'" class="nav-link">Journals</a>
        </nav>
        <div class="header-actions">
            <!-- ── Notification Bell (chỉ hiện khi đã đăng nhập) ── -->
            <div th:if="${currentUser != null}" class="client-notif-wrapper" id="clientNotifWrapper">
                <button class="client-notif-btn" id="clientNotifBtn" title="Notifications">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                    <span class="client-notif-badge" id="clientNotifBadge" style="display:none">0</span>
                </button>

                <!-- Popover -->
                <div class="client-notif-popover" id="clientNotifPopover" aria-hidden="true">
                    <!-- Header -->
                    <div class="client-notif-header">
                        <span class="client-notif-title">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                                 fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                            </svg>
                            Notifications
                        </span>
                        <button class="client-notif-mark-all" id="clientNotifMarkAll">
                            Mark all as read
                        </button>
                    </div>
                    <!-- Body -->
                    <div class="client-notif-body" id="clientNotifList">
                        <div class="client-notif-loading">Loading...</div>
                    </div>
                    <!-- Footer -->
                    <div class="client-notif-footer">
                        <a href="/notifications" class="client-notif-view-all">
                            View all notifications
                            <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24"
                                 fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 18 15 12 9 6"/>
                            </svg>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Cart -->
            <a href="/cart" class="action-btn" title="Cart">
                <svg th:replace="~{client/fragments/icons :: cart}"></svg>
            </a>

            <!-- User / Login -->
            <a th:if="${currentUser == null}" href="/login" class="action-btn" title="Account">
                <svg th:replace="~{client/fragments/icons :: user}"></svg>
            </a>
            <a th:if="${currentUser != null}" href="/profile" class="action-btn" title="Profile"
               style="display: flex; align-items: center; justify-content: center;">
                <div style="width: 24px; height: 24px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; background-color: #333; color: white; font-size: 12px; font-weight: bold;">
                    <img th:if="${currentUser.avatar != null and !currentUser.avatar.isEmpty()}"
                         th:src="${currentUser.avatar}" alt="Avatar"
                         style="width: 100%; height: 100%; object-fit: cover;" />
                    <span th:unless="${currentUser.avatar != null and !currentUser.avatar.isEmpty()}"
                          th:text="${#strings.isEmpty(currentUser.username) ? 'U' : #strings.substring(currentUser.username,0,1).toUpperCase()}">U</span>
                </div>
            </a>
        </div>
    </div>
</header>
</body>
</html>
