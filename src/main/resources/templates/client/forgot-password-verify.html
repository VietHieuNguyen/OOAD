<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{client/layout}">
<head><title>Verify OTP</title></head>
<body>
<main layout:fragment="content">
    <section class="auth-minimal">
        <div class="auth-minimal-card">
            <h2>Verify OTP</h2>
            <p>Enter the 6-digit code sent to your email.</p>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <form th:action="@{/forgot-password/verify}" method="post">
                <input type="hidden" name="email" th:value="${email}">
                <div class="form-group">
                    <label class="form-label">OTP CODE</label>
                    <input type="text" name="otp" class="form-input otp-input" placeholder="000000" maxlength="6" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Verify</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
