<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{client/layout}">
<head><title>Forgot Password</title></head>
<body>
<main layout:fragment="content">
    <section class="auth-minimal">
        <div class="auth-minimal-card">
            <h2>Reset Password</h2>
            <p>Enter your email address and we'll send you an OTP code.</p>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <form th:action="@{/forgot-password}" method="post">
                <div class="form-group">
                    <label class="form-label">EMAIL ADDRESS</label>
                    <input type="email" name="email" class="form-input" placeholder="your@email.com" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Send OTP</button>
            </form>
            <p class="register-prompt"><a href="/login">← Back to login</a></p>
        </div>
    </section>
</main>
</body>
</html>
