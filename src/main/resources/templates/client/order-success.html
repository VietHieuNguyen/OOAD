<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{client/layout}">
<head><title>Đặt hàng thành công</title></head>
<body>
<main layout:fragment="content">

    <section class="order-success-section">
        <div class="order-success-container">

            <!-- Icon thành công -->
            <div class="success-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                    <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
            </div>

            <h1 class="success-title"><em>Đặt hàng thành công!</em></h1>
            <p class="success-desc">Cảm ơn bạn đã đặt hàng. Đơn hàng của bạn đang được xử lý.</p>

            <!-- Thông tin đơn hàng -->
            <div class="success-details">
                <div class="success-detail-row">
                    <span class="detail-label">Mã đơn hàng</span>
                    <span class="detail-value" th:text="${order.orderId}">ORD-xxx</span>
                </div>
                <div class="success-detail-row">
                    <span class="detail-label">Ngày đặt</span>
                    <span class="detail-value"
                          th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}">01/01/2026</span>
                </div>
                <div class="success-detail-row">
                    <span class="detail-label">Trạng thái</span>
                    <span class="detail-value status-badge status-pending" th:text="${order.status}">PENDING</span>
                </div>
                <div class="success-detail-row">
                    <span class="detail-label">Tổng tiền</span>
                    <span class="detail-value detail-total"
                          th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</span>
                </div>
                <div class="success-detail-row">
                    <span class="detail-label">Địa chỉ giao hàng</span>
                    <span class="detail-value" th:text="${order.address}">Địa chỉ</span>
                </div>
            </div>

            <!-- Action buttons -->
            <div class="success-actions">
                <a th:href="@{'/orders/' + ${order.orderId}}" class="btn btn-primary">XEM CHI TIẾT ĐƠN HÀNG</a>
                <a href="/" class="btn btn-outline">TIẾP TỤC MUA SẮM</a>
            </div>
        </div>
    </section>

</main>
</body>
</html>
