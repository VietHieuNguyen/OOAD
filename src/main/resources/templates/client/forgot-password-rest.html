<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{client/layout}">
<head><title>Reset Password</title></head>
<body>
<main layout:fragment="content">
    <section class="auth-minimal">
        <div class="auth-minimal-card">
            <h2>New Password</h2>
            <p>Create a new password for your account.</p>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <form th:action="@{/forgot-password/reset}" method="post">
                <input type="hidden" name="email" th:value="${email}">
                <div class="form-group">
                    <label class="form-label">NEW PASSWORD</label>
                    <input type="password" name="newPassword" class="form-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Reset Password</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
