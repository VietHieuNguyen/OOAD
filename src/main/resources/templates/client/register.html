<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{client/layout}">
<head><title>Register</title></head>
<body>
<main layout:fragment="content">
    <section class="login-section">
        <div class="login-card">
            <div class="login-image">
                <div class="login-image-overlay">
                    <h1 class="login-brand"><em>X-Books</em></h1>
                    <p class="login-quote">"A room without books is like a body without a soul."</p>
                    <span class="login-est">EST. 2024</span>
                </div>
            </div>
            <div class="login-form-container">
                <h2 class="login-title">Create Account</h2>
                <p class="login-subtitle">Start your literary journey with a local X-Books account.</p>

                <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

                <form th:action="@{/register}" method="post" class="login-form">
                    <div class="form-group">
                        <label class="form-label">USERNAME</label>
                        <input type="text" name="username" class="form-input" placeholder="reader01" th:value="${username}" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">FULL NAME</label>
                        <input type="text" name="fullName" class="form-input" placeholder="Nguyen Van A" th:value="${fullName}" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">EMAIL ADDRESS</label>
                        <input type="email" name="email" class="form-input" placeholder="reader@xbooks.com" th:value="${email}" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">PHONE NUMBER</label>
                        <input type="text" name="phoneNumber" class="form-input" placeholder="0901234567" th:value="${phoneNumber}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">ADDRESS</label>
                        <input type="text" name="address" class="form-input" placeholder="Thu Duc, Ho Chi Minh City" th:value="${address}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">PASSWORD</label>
                        <div class="password-input-wrapper">
                            <input type="password" name="password" class="form-input" placeholder="********" required id="registerPassword">
                            <button type="button" class="toggle-password" onclick="togglePassword('registerPassword')">
                                <svg th:replace="~{client/fragments/icons :: eye}"></svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">
                        Create Account <svg th:replace="~{client/fragments/icons :: arrow-right}"></svg>
                    </button>
                </form>

                <div class="divider" th:if="${googleLoginEnabled}">
                    <span>OR CONTINUE WITH</span>
                </div>

                <div class="social-buttons" th:if="${googleLoginEnabled}">
                    <a th:href="@{/oauth2/authorization/google}" class="btn btn-social">
                        <svg th:replace="~{client/fragments/icons :: google}"></svg>
                        GOOGLE
                    </a>
                </div>

                <p class="register-prompt">
                    Already have an account? <a href="/login" class="register-link"><strong>Sign in</strong></a>
                </p>
            </div>
        </div>
    </section>
</main>
</body>
</html>
