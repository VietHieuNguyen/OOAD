<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{client/layout}">
<head><title>Đơn hàng của tôi</title></head>
<body>
<main layout:fragment="content">

    <section class="orders-section">
        <div class="orders-container">
            <h1 class="orders-title"><em>My Orders</em></h1>

            <!-- Không có đơn hàng -->
            <div th:if="${#lists.isEmpty(orders)}" class="orders-empty">
                <p>You have no orders yet.</p>
                <a href="/" class="btn btn-primary">START SHOPPING</a>
            </div>

            <!-- Bảng danh sách đơn hàng -->
            <div th:unless="${#lists.isEmpty(orders)}" class="orders-table-wrapper">
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>ORDER ID</th>
                            <th>DATE</th>
                            <th>ITEMS</th>
                            <th>TOTAL</th>
                            <th>STATUS</th>
                            <th>PAYMENT</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${orders}">
                            <td class="order-id-cell" th:text="${#strings.abbreviate(order.orderId, 12)}">ORD-xxx</td>
                            <td th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy')}">01/01/2026</td>
                            <td th:text="${order.items.size()}">0</td>
                            <td class="order-total-cell"
                                th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'">
                                0 ₫
                            </td>
                            <td>
                                <span class="status-badge"
                                      th:classappend="${order.status.name() == 'PENDING' ? ' status-pending' :
                                                        order.status.name() == 'CONFIRMED' ? ' status-confirmed' :
                                                        order.status.name() == 'COMPLETED' ? ' status-completed' :
                                                        ' status-cancelled'}"
                                      th:text="${order.status}">
                                    STATUS
                                </span>
                            </td>
                            <td>
                                <span th:if="${!order.payments.isEmpty()}"
                                      th:text="${order.payments.iterator().next().method.name() == 'COD' ? 'COD' : 'Bank Transfer'}">
                                    Method
                                </span>
                            </td>
                            <td>
                                <a th:href="@{'/orders/' + ${order.orderId}}" class="btn btn-outline btn-sm">
                                    DETAILS
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

</main>
</body>
</html>
