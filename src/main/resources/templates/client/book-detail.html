<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{client/layout}">
<head><title th:text="${book.title}">Book Detail</title></head>
<body>
<main layout:fragment="content">
    <section class="book-detail-section">
        <div class="book-detail-container">
            <a href="/collections" class="back-link">← Back to Collections</a>

            <div class="book-detail-grid">
                <!-- Book Image -->
                <div class="book-detail-image-col">
                    <div class="book-detail-image">
                        <img th:if="${book.thumbnail}" th:src="${book.thumbnail}" th:alt="${book.title}">
                        <div th:unless="${book.thumbnail}" class="book-detail-placeholder"></div>
                    </div>
                </div>

                <!-- Book Info -->
                <div class="book-detail-info-col">
                    <span class="book-detail-category" th:if="${book.category != null}" th:text="${book.category.name}">Category</span>
                    <h1 class="book-detail-title" th:text="${book.title}">Book Title</h1>
                    <p class="book-detail-author">by <strong th:text="${book.author}">Author Name</strong></p>

                    <div class="book-detail-price-block">
                        <span class="book-detail-price"
                              th:text="${#numbers.formatDecimal(book.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</span>
                    </div>

                    <div class="book-detail-meta">
                        <div class="meta-item">
                            <span class="meta-label">ISBN</span>
                            <span class="meta-value" th:text="${book.isbn}">978-xxx</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">STOCK</span>
                            <span class="meta-value"
                                  th:text="${book.stockQuantity > 0 ? 'In Stock (' + book.stockQuantity + ')' : 'Out of Stock'}"
                                  th:class="${book.stockQuantity > 0 ? 'in-stock' : 'out-of-stock'}">
                                In Stock
                            </span>
                        </div>
                    </div>

                    <!-- Staff Pick Badge -->
                    <div th:if="${book.isPicked}" class="staff-pick-inline-badge">
                        <span>★ STAFF PICK</span>
                    </div>

                    <!-- Add to Cart Form -->
                    <form th:action="@{/cart/add}" method="post" class="book-detail-cart-form">
                        <input type="hidden" name="bookId" th:value="${book.id}">
                        <div class="qty-selector">
                            <button type="button" class="qty-btn" onclick="changeQty(-1)">−</button>
                            <input type="number" name="quantity" id="qtyInput" value="1" min="1" th:max="${book.stockQuantity}" class="qty-input" readonly>
                            <button type="button" class="qty-btn" onclick="changeQty(1)">+</button>
                        </div>
                        <button type="submit" class="btn btn-primary btn-full"
                                th:disabled="${book.stockQuantity <= 0}">
                            ADD TO CART
                        </button>
                    </form>

                    <!-- Wishlist Toggle -->
                    <form th:action="@{/wishlist/toggle}" method="post" class="wishlist-toggle-form">
                        <input type="hidden" name="bookId" th:value="${book.id}">
                        <input type="hidden" name="redirectUrl" th:value="'/books/' + ${book.id}">
                        <button type="submit"
                                th:class="${isWishlisted} ? 'btn btn-primary btn-full wishlist-toggle-btn wishlisted' : 'btn btn-outline btn-full wishlist-toggle-btn'">
                            <svg th:if="${!isWishlisted}" th:replace="~{client/fragments/icons :: heart}"></svg>
                            <svg th:if="${isWishlisted}" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                            <span th:text="${isWishlisted} ? 'REMOVE FROM WISHLIST' : 'ADD TO WISHLIST'">ADD TO WISHLIST</span>
                        </button>
                    </form>

                    <!-- Flash messages -->
                    <div th:if="${success}" class="alert alert-success" th:text="${success}" style="margin-top: 0.75rem;"></div>
                    <div th:if="${info}" class="alert" style="background:#fff3e0; color:#e65100; border: 1px solid #ffb74d; padding:0.75rem 1rem; border-radius:8px; margin-top:0.75rem;" th:text="${info}"></div>
                </div>
            </div>

            <!-- Description — moved BELOW the action grid, rendered as HTML from TinyMCE -->
            <div th:if="${book.description != null and !#strings.isEmpty(book.description)}" class="book-detail-description-section">
                <h2 class="book-detail-desc-title">About This Book</h2>
                <div class="book-detail-desc-body" th:utext="${book.description}">Description</div>
            </div>
        </div>
    </section>

    <script>
        function changeQty(delta) {
            const input = document.getElementById('qtyInput');
            let val = parseInt(input.value) + delta;
            const max = parseInt(input.max) || 99;
            if (val < 1) val = 1;
            if (val > max) val = max;
            input.value = val;
        }
    </script>
</main>
</body>
</html>
