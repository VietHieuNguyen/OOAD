<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head><title th:text="${pageTitle}">Settings</title></head>
<body>
<div layout:fragment="content" class="settings-shell">

    <h2 class="page-main-title"><em>Site Settings</em></h2>
    <p class="page-subtitle">Manage your store's global configuration and brand identity.</p>

    <!-- Flash Messages -->
    <div th:if="${successMessage}" class="flash-msg flash-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="flash-msg flash-error" th:text="${errorMessage}"></div>

    <form th:action="@{/admin/settings}" method="post" enctype="multipart/form-data" class="settings-form">

        <div class="settings-grid">
            <!-- LEFT: Settings Fields -->
            <div class="settings-left">

                <!-- Brand Identity -->
                <div class="settings-card">
                    <h3 class="settings-card-title">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
                        <em>Brand Identity</em>
                    </h3>

                    <div class="form-group-admin">
                        <label class="form-label-admin" for="siteName">STORE NAME</label>
                        <input type="text" id="siteName" name="siteName" th:value="${siteName}"
                               class="form-input-admin" placeholder="e.g. X-Books" required />
                        <small class="form-hint">Tên website hiển thị trên header và footer.</small>
                    </div>
                </div>

                <!-- Hero Image -->
                <div class="settings-card">
                    <h3 class="settings-card-title">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                        <em>Hero Banner</em>
                    </h3>

                    <div class="form-group-admin">
                        <label class="form-label-admin" for="heroImageUrl">HERO IMAGE URL</label>
                        <input type="url" id="heroImageUrl" name="heroImageUrl" th:value="${heroImageUrl}"
                               class="form-input-admin" placeholder="https://..." />
                    </div>

                    <div class="form-group-admin">
                        <label class="form-label-admin" for="heroImageFile">HOẶC UPLOAD TỪ MÁY</label>
                        <input type="file" id="heroImageFile" name="heroImageFile" accept="image/*"
                               class="form-input-admin form-file-input" />
                    </div>

                    <!-- Hero Preview -->
                    <div class="hero-preview" th:if="${heroImageUrl}">
                        <label class="form-label-admin">PREVIEW</label>
                        <div class="hero-preview-box">
                            <img th:src="${heroImageUrl}" alt="Hero preview" />
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT: Publish Card -->
            <div class="settings-right">
                <div class="settings-card publish-card">
                    <h4 class="publish-title"><em>Publish Changes</em></h4>
                    <p class="publish-desc">Ensure all settings are finalized before pushing live to the storefront.</p>
                    <button type="submit" class="btn-publish-settings">SAVE &amp; SYNC STORE</button>
                    <a th:href="@{/admin/settings}" class="btn-discard">DISCARD DRAFT</a>
                </div>
            </div>
        </div>
    </form>
</div>
</body>
</html>
