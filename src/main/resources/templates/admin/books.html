<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head><title>Manage Books</title></head>
<body>
<div layout:fragment="content" class="books-shell">

    <!-- Page Header -->
    <div class="books-page-header">
        <div>
            <span class="panel-kicker">Catalog Management</span>
            <h2 class="books-page-title">Book Inventory</h2>
        </div>
        <a th:href="@{/admin/books/new}" class="btn-add-book">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>Add New Title</span>
        </a>
    </div>

    <!-- Flash Messages -->
    <div th:if="${successMessage}" class="flash-msg flash-success">
        <span th:text="${successMessage}">Success</span>
    </div>
    <div th:if="${errorMessage}" class="flash-msg flash-error">
        <span th:text="${errorMessage}">Error</span>
    </div>

    <!-- Search Bar -->
    <div class="books-toolbar">
        <form th:action="@{/admin/books}" method="get" class="books-search-form">
            <label class="inventory-search">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="search" name="keyword" th:value="${keyword}" placeholder="Search by title..." />
            </label>
            <button type="submit" class="inventory-filter">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <span>Search</span>
            </button>
            <a th:if="${keyword}" th:href="@{/admin/books}" class="btn-clear-search">Clear</a>
        </form>
        <span class="books-count" th:text="'Showing ' + ${#lists.size(books)} + ' titles'">Showing 0 titles</span>
    </div>

    <!-- Books Table -->
    <section class="dashboard-panel">
        <div class="inventory-table-wrap">
            <table class="inventory-table" id="booksTable">
                <thead>
                <tr>
                    <th>Title &amp; Author</th>
                    <th>ISBN</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="book : ${books}" class="inventory-row">
                    <!-- Title & Author -->
                    <td>
                        <div class="book-summary">
                            <img th:if="${book.thumbnail != null and !#strings.isEmpty(book.thumbnail)}"
                                 th:src="${book.thumbnail}" alt="" class="book-thumb" />
                            <div th:unless="${book.thumbnail != null and !#strings.isEmpty(book.thumbnail)}"
                                 class="book-thumb book-thumb-placeholder"></div>
                            <div class="book-copy">
                                <strong th:text="${book.title}">Book Title</strong>
                                <span th:text="${book.author}">Author Name</span>
                            </div>
                        </div>
                    </td>

                    <!-- ISBN -->
                    <td>
                        <span class="isbn-text" th:text="${book.isbn}">978-0-000-00000-0</span>
                    </td>

                    <!-- Category -->
                    <td th:text="${book.category != null ? book.category.name : 'N/A'}">Category</td>

                    <!-- Price -->
                    <td>
                        <span th:text="${#numbers.formatDecimal(book.price, 0, 'COMMA', 0, 'POINT')} + ' VND'">0 VND</span>
                    </td>

                    <!-- Stock -->
                    <td>
                        <span th:text="${book.stockQuantity} + ' copies'">0 copies</span>
                    </td>

                    <!-- Status -->
                    <td>
                        <span class="inventory-status status-pre-order"
                              th:if="${!book.isActive}">Inactive</span>
                        <span class="inventory-status"
                              th:if="${book.isActive}"
                              th:classappend="${book.stockQuantity > 10 ? ' status-in-stock' : (book.stockQuantity > 0 ? ' status-low-stock' : ' status-out')}"
                              th:text="${book.stockQuantity > 10 ? 'In Stock' : (book.stockQuantity > 0 ? 'Low Stock' : 'Out of Stock')}">
                            Status
                        </span>
                    </td>

                    <!-- Actions -->
                    <td>
                        <div class="inventory-actions">
                            <a th:href="@{/admin/books/edit/{id}(id=${book.id})}"
                               class="icon-button" title="Edit">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                            </a>
                            <!-- Toggle Active/Inactive -->
                            <form th:action="@{/admin/books/toggle-active/{id}(id=${book.id})}"
                                  method="post" style="display:inline;">
                                <button type="submit"
                                        class="icon-button"
                                        th:title="${book.isActive ? 'Vô hiệu hóa (ẩn khỏi client)' : 'Kích hoạt (hiển thị client)'}"
                                        th:style="${book.isActive ? 'color:#2e7d32' : 'color:#c62828'}">
                                    <!-- Eye icon when active, eye-off when inactive -->
                                    <svg th:if="${book.isActive}" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                    <svg th:unless="${book.isActive}" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                                </button>
                            </form>
                            <form th:action="@{/admin/books/delete/{id}(id=${book.id})}"
                                  method="post" style="display:inline;"
                                  onsubmit="return confirm('Bạn có chắc chắn muốn xóa sách này?');">
                                <button type="submit" class="icon-button icon-button-danger" title="Delete">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>

                <!-- Empty State -->
                <tr th:if="${#lists.isEmpty(books)}">
                    <td colspan="7" class="inventory-empty">
                        No books found. Click "Add New Title" to create one.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</div>
</body>
</html>
