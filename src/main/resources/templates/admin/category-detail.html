<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head><title th:text="${category.name}">Category Detail</title></head>
<body>
<div layout:fragment="content" class="cat-detail-shell">

    <!-- Back link -->
    <a th:href="@{/admin/categories}" class="book-form-back">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Back to Categories
    </a>

    <!-- Flash Messages -->
    <div th:if="${successMessage}" class="flash-msg flash-success">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span th:text="${successMessage}">Success</span>
    </div>
    <div th:if="${errorMessage}" class="flash-msg flash-error">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line>
            <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
        <span th:text="${errorMessage}">Error</span>
    </div>

    <!-- ============================================================ -->
    <!-- CATEGORY INFO CARD (Editable)                                -->
    <!-- ============================================================ -->
    <section class="dashboard-panel cat-detail-header">
        <div class="cat-detail-header-grid">
            <!-- Left: Category Image -->
            <div class="cat-detail-img-wrap">
                <img th:if="${category.imageUrl != null and !#strings.isEmpty(category.imageUrl)}"
                     th:src="${category.imageUrl}" alt="" class="cat-detail-img" />
                <div th:unless="${category.imageUrl != null and !#strings.isEmpty(category.imageUrl)}"
                     class="cat-detail-img-placeholder">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    <span>No image</span>
                </div>
            </div>

            <!-- Right: Category Info + Inline Edit Form -->
            <div class="cat-detail-info">
                <div class="cat-detail-info-header">
                    <div>
                        <span class="panel-kicker">Category Detail</span>
                        <h2 class="cat-detail-name" th:text="${category.name}">Category Name</h2>
                    </div>
                    <div class="cat-detail-meta">
                        <span class="inventory-status status-in-stock"
                              th:text="${#lists.size(books)} + ' titles'">0 titles</span>
                    </div>
                </div>

                <!-- Inline Edit Form -->
                <form th:action="@{/admin/categories/save}" method="post" class="cat-detail-edit-form">
                    <input type="hidden" name="id" th:value="${category.id}" />
                    <input type="hidden" name="returnTo" value="detail" />

                    <div class="form-row-admin">
                        <div class="form-group-admin">
                            <label class="form-label-admin" for="catName">CATEGORY NAME</label>
                            <input type="text" id="catName" name="name" th:value="${category.name}"
                                   class="form-input-admin" required />
                        </div>
                        <div class="form-group-admin">
                            <label class="form-label-admin" for="catImage">IMAGE URL</label>
                            <input type="url" id="catImage" name="imageUrl" th:value="${category.imageUrl}"
                                   class="form-input-admin" placeholder="https://..." />
                        </div>
                    </div>

                    <div class="cat-detail-edit-actions">
                        <button type="submit" class="btn-publish btn-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                 stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                            <span>Save Changes</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- ============================================================ -->
    <!-- BOOKS IN THIS CATEGORY                                       -->
    <!-- ============================================================ -->
    <section class="dashboard-panel">
        <div class="panel-heading inventory-heading">
            <div>
                <span class="panel-kicker">Books in this Category</span>
                <h3 th:text="'Titles under ' + ${category.name}">Titles</h3>
            </div>
            <a th:href="@{/admin/books/new}" class="btn-add-book btn-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>Add Book</span>
            </a>
        </div>

        <div class="inventory-table-wrap">
            <table class="inventory-table">
                <thead>
                <tr>
                    <th>Title &amp; Author</th>
                    <th>ISBN</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="book : ${books}" class="inventory-row">
                    <!-- Title & Author (clickable - links to Edit page) -->
                    <td>
                        <a th:href="@{/admin/books/edit/{id}(id=${book.id})}" class="book-link">
                            <div class="book-summary">
                                <img th:if="${book.thumbnail != null and !#strings.isEmpty(book.thumbnail)}"
                                     th:src="${book.thumbnail}" alt="" class="book-thumb" />
                                <div th:unless="${book.thumbnail != null and !#strings.isEmpty(book.thumbnail)}"
                                     class="book-thumb book-thumb-placeholder"></div>
                                <div class="book-copy">
                                    <strong th:text="${book.title}">Book Title</strong>
                                    <span th:text="${book.author}">Author</span>
                                </div>
                            </div>
                        </a>
                    </td>

                    <!-- ISBN -->
                    <td>
                        <span class="isbn-text" th:text="${book.isbn}">978-0-000</span>
                    </td>

                    <!-- Price -->
                    <td>
                        <span th:text="${#numbers.formatDecimal(book.price, 0, 'COMMA', 0, 'POINT')} + ' VND'">0 VND</span>
                    </td>

                    <!-- Stock -->
                    <td th:text="${book.stockQuantity} + ' copies'">0 copies</td>

                    <!-- Status -->
                    <td>
                        <span class="inventory-status"
                              th:classappend="${book.stockQuantity > 10 ? ' status-in-stock' : (book.stockQuantity > 0 ? ' status-low-stock' : ' status-out')}"
                              th:text="${book.stockQuantity > 10 ? 'In Stock' : (book.stockQuantity > 0 ? 'Low Stock' : 'Out of Stock')}">
                            Status
                        </span>
                    </td>

                    <!-- Actions -->
                    <td>
                        <div class="inventory-actions">
                            <a th:href="@{/admin/books/edit/{id}(id=${book.id})}"
                               class="icon-button" title="Edit Book">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                     fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                     stroke-linejoin="round">
                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                </svg>
                            </a>
                            <form th:action="@{/admin/books/delete/{id}(id=${book.id})}"
                                  method="post" style="display:inline;"
                                  onsubmit="return confirm('Ban co chac chan muon xoa cuon sach nay?');">
                                <button type="submit" class="icon-button icon-button-danger" title="Delete Book">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                         fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                         stroke-linejoin="round">
                                        <polyline points="3 6 5 6 21 6"></polyline>
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                    </svg>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>

                <!-- Empty State -->
                <tr th:if="${#lists.isEmpty(books)}">
                    <td colspan="6" class="inventory-empty">
                        No books in this category yet.
                        <a th:href="@{/admin/books/new}" style="color: var(--green-mid); text-decoration: underline;">
                            Add the first one &rarr;
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</div>
</body>
</html>
